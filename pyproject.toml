[project]
name = "quantumcanvas"
version = "1.0.1"
description = "QuantumCanvas: A Multimodal Benchmark for Learning Two-Body Quantum Interactions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Can Polat" },
    { name = "Mustafa Kurban" },
    { name = "Erchin Serpedin" },
    { name = "Hasan Kurban" },
]
keywords = [
    "machine learning for interatomic interactions",
    "two-body quantum systems",
    "multimodal benchmark",
    "orbital-image representations",
    "molecular property prediction",
]

dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    # torch-geometric 2.5.3 (DimeNet++) uses np.math, removed in numpy 2.
    "numpy>=1.24.0,<2.0.0",
    "torch-geometric==2.5.3",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.urls]
Paper = "https://doi.org/10.1088/2632-2153/aea5d6"
Dataset = "https://doi.org/10.5281/zenodo.20631934"
Repository = "https://github.com/KurbanIntelligenceLab/QuantumCanvas"

[project.optional-dependencies]
# Linux: prebuilt CUDA 12.8 wheels, Windows: prebuilt CPU wheels (data.pyg.org). macOS: built from source.
pyg-ext = [
    "torch-scatter==2.1.2+pt28cu128; sys_platform == 'linux'",
    "torch-sparse==0.6.18+pt28cu128; sys_platform == 'linux'",
    "torch-cluster==1.6.3+pt28cu128; sys_platform == 'linux'",
    "torch-spline-conv==1.2.2+pt28cu128; sys_platform == 'linux'",
    "torch-scatter==2.1.2; sys_platform == 'darwin'",
    "torch-sparse==0.6.18; sys_platform == 'darwin'",
    "torch-cluster==1.6.3; sys_platform == 'darwin'",
    "torch-spline-conv==1.2.2; sys_platform == 'darwin'",
    "torch-scatter==2.1.2+pt28cpu; sys_platform == 'win32'",
    "torch-sparse==0.6.18+pt28cpu; sys_platform == 'win32'",
    "torch-cluster==1.6.3+pt28cpu; sys_platform == 'win32'",
    "torch-spline-conv==1.2.2+pt28cpu; sys_platform == 'win32'",
]
gotennet = [
    "gotennet>=1.1.2",
    # imported by gotennet at runtime but not declared by it
    "omegaconf>=2.3.0",
    "pytorch-lightning>=2.0.0",
]
faenet = [
    "faenet>=0.1.3",
]
# Everything the benchmark scripts import (benchmarks/models.py needs faenet + torch-scatter).
benchmarks = [
    "quantumcanvas[pyg-ext,faenet,gotennet]",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantumcanvas", "benchmarks"]

[tool.uv]
# Supported platforms: Linux (CUDA 12.8 torch from PyPI), macOS (CPU/MPS), Windows (CPU torch from PyPI).
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]
# Prebuilt PyG extension wheels matching PyPI's torch 2.8.0: cu128 on Linux, CPU on Windows.
# macOS has no prebuilt wheels, so there they are compiled against the pinned torch.
find-links = ["https://data.pyg.org/whl/torch-2.8.0+cu128.html", "https://data.pyg.org/whl/torch-2.8.0+cpu.html"]

[tool.uv.extra-build-dependencies]
torch-scatter = [{ requirement = "torch", match-runtime = true }, "setuptools"]
torch-sparse = [{ requirement = "torch", match-runtime = true }, "setuptools"]
torch-cluster = [{ requirement = "torch", match-runtime = true }, "setuptools"]
torch-spline-conv = [{ requirement = "torch", match-runtime = true }, "setuptools"]

[tool.ruff]
line-length = 120
extend-exclude = ["development", "data", "outputs"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Static metadata for the macOS source builds, so locking doesn't have to build them.
[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "torch-sparse"
version = "0.6.18"
requires-dist = ["scipy"]

[[tool.uv.dependency-metadata]]
name = "torch-cluster"
version = "1.6.3"
requires-dist = ["scipy"]

[[tool.uv.dependency-metadata]]
name = "torch-spline-conv"
version = "1.2.2"
requires-dist = []
