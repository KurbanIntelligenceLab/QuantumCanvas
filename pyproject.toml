[project]
name = "quantumcanvas"
version = "1.0.0"
description = "A multimodal benchmark for learning two-body quantum interactions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"

dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "torch-geometric==2.5.3",
    "e3nn>=0.5.0",
    "ase>=3.26.0",
    "mendeleev>=1.1.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pytorch-lightning>=2.0.0",
    "omegaconf>=2.3.0",
    "torchmetrics>=1.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "fsspec>=2023.0.0",
]

[project.optional-dependencies]
pyg-ext = [
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "torch-spline-conv>=1.2.2",
]
gotennet = [
    "gotennet>=1.1.2",
]
faenet = [
    "faenet>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.uv]
no-build-isolation-package = ["torch-scatter", "torch-sparse", "torch-cluster", "torch-spline-conv"]
